<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>槐花优选 · 主题分布</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%232f6fed'/><g transform='translate(32 33)'><circle cx='0' cy='-6.6' r='5' fill='%23fff'/><circle cx='6.3' cy='-2' r='5' fill='%23fff'/><circle cx='3.9' cy='5.4' r='5' fill='%23fff'/><circle cx='-3.9' cy='5.4' r='5' fill='%23fff'/><circle cx='-6.3' cy='-2' r='5' fill='%23fff'/><circle r='3' fill='%23f5bd4f'/></g></svg>" />
  <style>
    /* ===== 方案A · 医疗信任蓝 ===== */
    :root {
      --ink: #1e293b;
      --fur: #2f6fed;
      --coral: #2f6fed;
      --cream: #ffffff;
      --paper: #f6f9fd;
      --muted: #8494a8;
      --error: #dc4a5e;
      --online: #22c55e;
      --shadow: 0 2px 8px rgba(30,41,59,.07);
      --shadow-sm: 0 1px 2px rgba(30,41,59,.05);
      --shadow-lg: 0 12px 40px rgba(30,41,59,.12);
      --bg: #eef3f9;
      --surface: #ffffff;
      --surface-2: #f6f9fd;
      --border: #e3eaf3;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background-color: var(--bg);
      padding: 24px 16px 64px;
    }
    .wrap { max-width: 1080px; margin: 0 auto; }

    .topbar {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      box-shadow: var(--shadow-sm);
      padding: 14px 18px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    }
    .topbar h1 { font-size: 18px; margin: 0; letter-spacing: 1px; }
    .topbar .sub { color: var(--muted); font-size: 12px; }
    .spacer { flex: 1; }
    .btn {
      font: inherit; cursor: pointer; border: 1px solid var(--border); background: var(--surface);
      color: var(--ink); padding: 6px 14px; border-radius: 8px; box-shadow: var(--shadow-sm);
      font-weight: 600; transition: all .15s ease;
    }
    .btn:hover { background: #eaf1fe; border-color: var(--fur); color: var(--fur); }
    .btn:active { transform: scale(.97); }

    /* 统计条 */
    .stats {
      margin-top: 16px; display: flex; gap: 14px; flex-wrap: wrap;
    }
    .stat {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      box-shadow: var(--shadow-sm);
      padding: 10px 16px; font-size: 13px;
    }
    .stat b { font-size: 20px; display: block; }

    /* 分布条形图 */
    .chart {
      margin-top: 16px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; box-shadow: var(--shadow-sm); padding: 16px 18px;
    }
    .chart h2 { font-size: 14px; margin: 0 0 12px; }
    .row { margin: 6px 0; }
    .row summary {
      display: flex; align-items: center; gap: 10px; cursor: pointer; list-style: none;
    }
    .row summary::-webkit-details-marker { display: none; }
    .row .name { width: 6.5em; flex-shrink: 0; font-size: 13px; font-weight: 700; text-align: right; }
    /* 类目名是链接:点它跳到这一类的问题列表,展开只看三条样例 */
    .row .name a {
      color: var(--fur); text-decoration: none; border-bottom: 1px solid var(--fur);
      transition: background .15s ease;
    }
    .row .name a:hover { background: #eaf1fe; }
    .row.zero .name a { border-bottom-color: var(--muted); color: var(--muted); }
    .samples .all {
      display: inline-block; margin-top: 7px; font-size: 12px; text-decoration: none;
      color: var(--fur); border: 1px solid var(--border); background: var(--surface);
      padding: 2px 10px; border-radius: 999px; font-weight: 600; transition: all .15s ease;
    }
    .samples .all:hover { background: #eaf1fe; border-color: var(--fur); }
    .row .track {
      flex: 1; background: var(--surface-2); border: 1px solid var(--border); height: 22px;
      position: relative; border-radius: 999px; overflow: hidden;
    }
    .row .bar {
      display: block; height: 100%; background: var(--fur); border-radius: 999px;
      min-width: 2px; transition: width .4s;
    }
    .row.zero .bar { display: none; }
    .row.zero { opacity: .45; }
    .row .count {
      width: 3em; flex-shrink: 0; font-weight: 700; font-size: 13px;
    }
    .row.top1 .bar { background: var(--coral); }
    .samples {
      margin: 6px 0 10px calc(6.5em + 10px); font-size: 12.5px; color: var(--ink);
      background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px;
    }
    .samples div { margin: 2px 0; }
    .samples .none { color: var(--muted); }
    .hint { margin-top: 10px; font-size: 12px; color: var(--muted); }
    .err {
      margin-top: 16px; background: #fde8ea; border: 1px solid var(--error); border-radius: 10px;
      color: var(--error); padding: 10px 14px; font-size: 13px; display: none;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <h1>主题分布</h1>
      <span class="sub">低置信度问题 → 分类器旁路归类 → 哪类堆得多,先补哪块知识</span>
      <span class="spacer"></span>
      <button class="btn" id="refreshBtn">刷新</button>
    </div>

    <div class="stats">
      <div class="stat">已归类问题<b id="total">-</b></div>
      <div class="stat">最近归类<b id="latest" style="font-size:14px;line-height:28px">-</b></div>
      <div class="stat">命中类目数<b id="hitClasses">-</b></div>
    </div>

    <div class="chart">
      <h2>17 类权威类目 · 问题量(降序,点行展开样例,点类目名看全部)</h2>
      <div id="rows"></div>
      <div class="hint">数据来自 topic_classifications(make classify-pool 旁路批量归类);多标签问题计入每个命中类目。</div>
    </div>

    <div class="err" id="err"></div>
  </div>

  <script src="/static/admin.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);

    async function load() {
      try {
        const r = await fetch('/api/topics/distribution');
        if (!r.ok) throw new Error('HTTP ' + r.status);
        render(await r.json());
        $('err').style.display = 'none';
      } catch (e) {
        $('err').textContent = '拉取分布失败:' + e.message;
        $('err').style.display = 'block';
      }
    }

    function render(data) {
      $('total').textContent = data.total;
      // classified_at 存的是 UTC(MySQL 容器时区),补 Z 后按本地时区渲染
      $('latest').textContent = data.latest
        ? new Date(data.latest + 'Z').toLocaleString('zh-CN', {
            year: 'numeric', month: '2-digit', day: '2-digit',
            hour: '2-digit', minute: '2-digit', hour12: false,
          })
        : '—';
      const classes = [...data.classes].sort((a, b) => b.count - a.count);
      $('hitClasses').textContent = classes.filter(c => c.count > 0).length + ' / 17';
      const max = Math.max(1, ...classes.map(c => c.count));
      const rows = $('rows');
      rows.innerHTML = '';
      classes.forEach((c, i) => {
        const d = document.createElement('details');
        d.className = 'row' + (c.count === 0 ? ' zero' : '') + (i === 0 && c.count > 0 ? ' top1' : '');
        const pct = Math.round(c.count / max * 100);
        const href = '/topics/questions?label=' + encodeURIComponent(c.label) + '&page=1';
        d.innerHTML = `
          <summary>
            <span class="name">${c.count ? `<a href="${href}">${c.label}</a>` : c.label}</span>
            <span class="track"><span class="bar" style="width:${pct}%"></span></span>
            <span class="count">${c.count}</span>
          </summary>
          <div class="samples">${
            c.samples.length
              ? c.samples.map(s => `<div>· ${s}</div>`).join('')
                + `<a class="all" href="${href}">查看全部 ${c.count} 条 →</a>`
              : '<div class="none">暂无样例</div>'
          }</div>`;
        rows.appendChild(d);
      });
    }

    $('refreshBtn').onclick = load;
    mountAdminNav('/topics');
    load();
  </script>
</body>
</html>
