<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>槐花优选 · 后台管理</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%232f6fed'/><g transform='translate(32 33)'><circle cx='0' cy='-6.6' r='5' fill='%23fff'/><circle cx='6.3' cy='-2' r='5' fill='%23fff'/><circle cx='3.9' cy='5.4' r='5' fill='%23fff'/><circle cx='-3.9' cy='5.4' r='5' fill='%23fff'/><circle cx='-6.3' cy='-2' r='5' fill='%23fff'/><circle r='3' fill='%23f5bd4f'/></g></svg>" />
  <link rel="stylesheet" href="/static/acceptance.css" />
  <style>
    .mods { margin-top: 16px; display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
    .mod {
      background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow);
      border-radius: 12px;
      padding: 12px 14px 14px; display: flex; flex-direction: column;
    }
    .mod .head { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
    .mod h3 { font-size: 15px; margin: 0; }
    .mod .lede { color: var(--muted); font-size: 12px; line-height: 1.7; margin: 7px 0 0; }
    .mod .headline {
      margin: 10px 0 0; font-size: 13px; line-height: 1.7; background: var(--surface-2);
      border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px;
    }
    .mod .kpis { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .mod .kpi {
      border: 1px solid var(--border); background: var(--surface-2); border-radius: 8px;
      padding: 4px 9px; font-size: 11.5px;
      min-width: 76px;
    }
    .mod .kpi b { display: block; font-size: 17px; line-height: 1.4; }
    .mod .note { margin-top: 8px; font-size: 11.5px; color: var(--muted); line-height: 1.7; }
    .mod .foot { margin-top: auto; padding-top: 12px; }
    .pill.ok { background: #dcfce7; border-color: #b7e4c3; color: #15803d; }
    .pill.attention { background: #eaf1fe; border-color: #c8daf9; color: var(--fur); }
    .pill.error { background: #fde8ea; border-color: #f3c1ca; color: var(--error); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <h1>后台管理</h1>
      <span class="sub">知识库、检索评估、飞轮、分类器，几块后台都在这里，不用回终端</span>
      <span class="spacer"></span>
      <button class="btn" id="refreshBtn">刷新</button>
    </div>

    <div class="tip">
      口径：<b>正常</b>这块是活的且没有待办；<b>要干活</b>有待办或两边数对不上；
      <b>没数据</b>还没跑过，进去按一下就有；<b>读数失败</b>这块的依赖没起（mysql / Milvus /
      嵌入上游 / 分类器 :8110），只影响它自己那张卡。
    </div>

    <div class="mods" id="mods"><div class="miss">加载中…</div></div>
  </div>

  <div id="toast"></div>
  <script src="/static/admin.js"></script>
  <script src="/static/acceptance.js"></script>
  <script>
    const LABEL = { ok: "正常", attention: "要干活", missing: "没数据", error: "读数失败" };

    function card(m) {
      const box = el("div", "mod " + m.status);
      const head = el("div", "head");
      head.appendChild(el("h3", null, m.title));
      head.appendChild(el("span", "spacer"));
      head.appendChild(el("span", "pill " + m.status, LABEL[m.status] || m.status));
      box.appendChild(head);
      box.appendChild(el("p", "lede", m.lede));
      box.appendChild(el("div", "headline", m.headline));
      if (m.metrics.length) {
        const kpis = el("div", "kpis");
        for (const k of m.metrics) {
          const kpi = el("div", "kpi");
          kpi.appendChild(el("b", null, k.value === null || k.value === undefined ? "—" : k.value));
          kpi.appendChild(document.createTextNode(k.label));
          kpis.appendChild(kpi);
        }
        box.appendChild(kpis);
      }
      if (m.note) box.appendChild(el("div", "note", m.note));
      const foot = el("div", "foot");
      const a = el("a", "btn go", "进入 " + m.title + " →");
      a.href = m.page;
      foot.appendChild(a);
      box.appendChild(foot);
      return box;
    }

    async function load() {
      const box = $("mods");
      try {
        const d = await api("/api/admin/overview");
        box.textContent = "";
        for (const m of d.modules) box.appendChild(card(m));
      } catch (e) {
        box.textContent = "";
        box.appendChild(missingBox("取数失败：" + e.message));
      }
    }

    mountAdminNav("/admin");
    $("refreshBtn").addEventListener("click", load);
    load();
  </script>
</body>
</html>
